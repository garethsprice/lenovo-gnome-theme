# Lenovo brand palette for tmux (matches the Ghostty "Lenovo" theme)
#   Signature Red #E1251B · Accent Red #871C23 · Pale Gray #E6E2E4
#   Near-black #1C1A1C · Deep Gray #4E444E
# Colours are hex, not names: tmux's "white" is ANSI colour 7, which the theme sets to Mid Gray.
set -g status-style "bg=#E1251B,fg=#FFFFFF"
set -g window-status-current-style "bg=#1C1A1C,fg=#FFFFFF,bold"
set -g window-status-activity-style "bg=#E1251B,fg=#1C1A1C"
set -g pane-border-style "fg=#4E444E"
set -g pane-active-border-style "fg=#E1251B"
set -g message-style "bg=#871C23,fg=#FFFFFF"
set -g message-command-style "bg=#871C23,fg=#E6E2E4"
set -g mode-style "bg=#871C23,fg=#FFFFFF"
set -g display-panes-active-colour "#E1251B"
set -g display-panes-colour "#E6E2E4"
set -g clock-mode-colour "#E1251B"
